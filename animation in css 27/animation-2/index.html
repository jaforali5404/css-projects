<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animation</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Playwrite+DE+SAS+Guides&family=Redaction:ital,wght@0,400;0,700;1,400&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
     
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background-image: url(nature.jpg);
            background-repeat: no-repeat;
            background-size: 100% 100%;
        }

        img {
            width: 200px;
            position: absolute;
            bottom: 50px;
            animation: mariorun 2.5s linear;
            animation-iteration-count: infinite;
        }

        @keyframes mariorun {
            0%{
                translate: 0%;
            }

            100%{
                translate: calc(100vw - 200px);
            }
        }
    </style>
</head>
<body>
    <img src="mario-16-bit.gif" alt="mofa run">
    
</body>
</html>
