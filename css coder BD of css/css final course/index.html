<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page design</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="login-page">
        <div class="login-form">
            <h1 class="login-title">login</h1>
            <form action="">
                <div class="email-input">
                    <label for="email-input">Email</label>
                    <input type="text" placeholder="username@gmail.com">
                </div>
                <div class="password-input">
                    <label for="password-input">password</label>
                    <input type="text" placeholder="password">
                </div>
                <div class="forget-link">
                    <a href="#">forget password?</a>
                </div>
                <div class="submit-botton">
                    <input type="submit" value="sign in">
                </div>
                <div class="continuewith-label">
                    or continue with
                </div>
                <div class="login-with-btn">
                    <a href="#"> 
                        <img src="google-logo-png.webp" alt="Google Logo" style="width: 30px; height: auto;">
                    </a>
                    <a href="#"> 
                        <img src="github.png" alt="github Logo" style="width: 30px; height: auto;">
                    </a>
                    <a href="#"> 
                        <img src="facebook.png" alt="facebook Logo" style="width: 30px; height: auto;">
                    </a>
                </div>
                <div class="dont-have-account">
                    Don't heve an account yet? <a href="#">register for free</a>
                </div>
            </form>
            <img class="left-image-component" src="component.jpeg" alt="Description" style="width: 100px; height: auto;">
           <img class="right-image-component" src="component 1.jpeg" alt="Description" style="width: 100px; height: auto;">

        </div>

    </section>
    
</body>
</html>
