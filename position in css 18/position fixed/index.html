<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Playwrite+DE+SAS+Guides&family=Redaction:ital,wght@0,400;0,700;1,400&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Document</title>
    <style>
    * {
       margin: 0;
       padding: 0;
       box-sizing: border-box;
    } 

    html {
        font-size: 32px;
        font-family: "urbanist", sans-serif;
    }

    body {
        display: grid;
        place-items: center;
   }

   .main-section {
    width: 100%;
    background-color: #0c0a81;
    font-size: 36px;
    text-align: center;
    color: #fff;
    box-shadow: rgba(0, 0, 0, 0.1) 0px 4px 12px,
    rgba(0, 0, 0, 0.1) 0px -12px 12px, rgba(0, 0, 0, 0.6) 0px 10px 12px,
    rgba(0, 0, 0, 0.12) 0px 14px 12px, rgba(0, 0, 0, 0.12) 0px -4px 12px;
    position: fixed;
    top: 0;
}

#main-heading {
    font-size: 6 2rem;
    margin: 3rem 0;
}

.section-full {
    width: 100%;
    height: 100vh;
    background: linear-gradient(to right, #1d2f2f, #ff11ff);
}

.section-full:nth-child(even) {
    background: linear-gradient(to right, #072c2c, #3d2c3d);
}

.section-full a {
    padding: 16px 32px;
    background-color: #fff;
    color: #1d2f2f;
    font-size: 24px;
    display: inline-block;
    position: fixed;
    /* position: sticky; */
    top: 50%;
}
    </style>
</head>
<body>
    <div class="main-section">
       <h1 id="main-heading">css poseition-fixed</h1>
    </div>
    <hr>
    <div class="section-full"></div>
    <div class="section-full"><a href="#">join tha whatsapp new</a></div>
    <div class="section-full"></div>
    <div class="section-full"></div>
    
</body>
</html>
